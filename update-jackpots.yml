name: Update lottery jackpots

on:
  schedule:
    # Runs at 06:00 and 22:00 UTC every day — frequent enough to catch
    # each draw's new "next estimated jackpot" without needing exact
    # draw-time precision. Adjust if you want it tighter.
    - cron: "0 6,22 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch jackpots
        run: python scripts/fetch_jackpots.py

      - name: Commit updated jackpots.json
        run: |
          git config user.name "jackpot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jackpots.json
          git diff --quiet --cached || git commit -m "Update jackpots $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
